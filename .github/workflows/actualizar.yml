name: Actualizar datos

on:
  schedule:
    - cron: "17 10 * * 1-5"   # lunes a viernes, ~07:17 hora de Chile (verano)
  workflow_dispatch:
    inputs:
      dias:
        description: "Días de histórico a revisar (vacío = valor de config.json)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Consultar Mercado Público
        run: python scripts/actualizar.py
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
          DIAS: ${{ github.event.inputs.dias }}
          MAX_MINUTOS: "240"
          PYTHONUNBUFFERED: "1"

      - name: Guardar datos en el repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          # Los datos de esta ejecución son los más recientes: se guardan sobre la versión actual del repositorio
          # (evita perder la ejecución si otra guardó datos mientras esta corría).
          cp -r data /tmp/datos-nuevos
          git fetch origin main
          git reset --hard origin/main
          rm -rf data && cp -r /tmp/datos-nuevos data
          git add data
          git diff --cached --quiet || git commit -m "Datos actualizados $(date -u +%F)"
          git push origin HEAD:main
